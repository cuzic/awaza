[package]
name = "awaza-tip"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "awaza TSF TIP本体(COM DLL)"

[lib]
name = "awaza_tip"
crate-type = ["cdylib"]

[dependencies]
awaza-chord = { path = "../awaza-chord" }
# awase-vkmapがまだrevピン(refactor/awase-vkmap-extract)なので、awase/timed-fsm
# も同じrevに揃える(揃えないとCargoが別パッケージとして解決し、PhysicalPos等の
# 型が2つに分裂してコンパイルエラーになる。design doc R-9で予見していたリスクが
# 実際に発生・修正した、2026-08-25)。マージ・タグ発行後はタグ参照に統一する。
awase = { git = "https://github.com/cuzic/awase", rev = "28009198c88a873ce4d675d4ad7f3c1d22504baa" }
timed-fsm = { git = "https://github.com/cuzic/awase", rev = "28009198c88a873ce4d675d4ad7f3c1d22504baa", package = "timed-fsm" }
# awase-vkmapはまだリリースタグに乗っていない(refactor/awase-vkmap-extract、
# PRレビュー待ち)。design doc §5の依存ピン規則はrevでのピンをPhase 0/1の
# スパイクに限り許容している。マージ・リリースされ次第タグ参照に切り替える。
awase-vkmap = { git = "https://github.com/cuzic/awase", rev = "28009198c88a873ce4d675d4ad7f3c1d22504baa", package = "awase-vkmap" }
# libakaza: `branch = "main"` は禁止(design doc ADR-B)。crates.io未公開のためgitタグピン。
libakaza = { git = "https://github.com/akaza-im/akaza", tag = "v2026.602.0" }
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_SystemServices",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
]

[target.'cfg(windows)'.dependencies.windows-core]
version = "0.62"

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
doc_markdown = "allow"
multiple_unsafe_ops_per_block = "allow"
